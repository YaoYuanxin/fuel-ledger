:root{

  --pro:#0C7A64; --carb:#A9700F; --fat:#6A4BB0;
  --good:#1B7F45; --warn:#B4500A; --bad:#B3261E;

  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){

    --accent:#3CC4A4; --accent-ink:#06211B;
    --pro:#3CC4A4; --carb:#E0A640; --fat:#A68BE8;
    --good:#5FD08C; --warn:#F0A05A; --bad:#F2857C;
    --good-bg:#16301F; --warn-bg:#3A2713; --info-bg:#1B2738; --info:#9DB7E0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#151F1D; --ink:#E5EEEB; --muted:#93A6A1; --line:#27352F; --soft:#1C2926;

  --good:#5FD08C; --warn:#F0A05A; --bad:#F2857C;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}

h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.01em}

nav.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.daynav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.balance{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}

.nudge{font-size:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.quick{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end}

.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.sec{display:flex;flex-direction:column;gap:12px;min-width:0}

.sug{display:flex;flex-direction:column}

.chat{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow-y:auto}
.msg{white-space:pre-wrap;padding:9px 12px;border-radius:10px;max-width:88%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.assistant{align-self:flex-start;background:var(--soft)}
.msg.note{align-self:center;font-size:12.5px;color:var(--muted);padding:0;text-align:center}
#chat-q{flex:1;width:auto;min-width:160px}

.sug .s-name{min-width:0}

.pick{background:var(--soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}

.entry .e-k{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .raw{fill:var(--muted);opacity:.55}
.chart .trend{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .goal{stroke:var(--fat);stroke-width:1.2;stroke-dasharray:5 4}
.chart .goal-t{fill:var(--fat)}
.chart .tgt{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
.chart .tgt-t{fill:var(--ink)}
.chart .b{fill:var(--accent);opacity:.8}
.chart .b.hi{fill:var(--warn)}
.chart .b.now{opacity:.35}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px;background:var(--accent)}
.legend i.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.legend i.gl{background:var(--fat)} .legend i.wn{background:var(--warn);height:8px;width:8px}
.seg{display:inline-flex;background:var(--soft);padding:3px;border-radius:8px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.adv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;align-self:start;margin-top:2px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.adv p{color:var(--muted);max-width:65ch;grid-column:2}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ask-out{white-space:pre-wrap;max-width:70ch}
.err{color:var(--bad);font-size:14px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:500}
details p{color:var(--muted);max-width:68ch;margin-top:8px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
.foot{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){
  .big{font-size:44px}
  .eq{text-align:left}
  .macros{grid-template-columns:1fr;gap:10px}
  nav.tabs{width:100%} nav.tabs a{flex:1;text-align:center;padding:7px 6px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}

<script>
"use strict";
/* ---------- constants ---------- */
const LB_KG = 0.45359237, KCAL_PER_LB = 3500, LS_KEY = "fuel-ledger-v1";
const MEALS = ["Breakfast","Lunch","Dinner","Snacks"];
const ACT = [[1.2,"Sedentary: desk job, little exercise"],[1.375,"Light: 1–3 sessions a week"],[1.55,"Moderate: 3–5 sessions a week"],[1.725,"Hard: 6–7 sessions a week"],[1.9,"Physical job plus training"]];
const PACE = [[0.25,"0.25% of bodyweight / week · gentle"],[0.5,"0.5% / week · standard"],[0.75,"0.75% / week · assertive"],[1,"1.0% / week · aggressive"]];
const PRO = [[0.7,"0.7 g/lb (1.6 g/kg)"],[0.8,"0.8 g/lb (1.8 g/kg)"],[1,"1.0 g/lb (2.2 g/kg)"],[1.2,"1.2 g/lb (2.6 g/kg)"]];
// name, serving, kcal, protein, carbs, fat
const FOODS = [
["Chicken breast, cooked","4 oz",187,35,0,4],["Chicken thigh, cooked","4 oz",232,28,0,13],["Ground beef 90/10, cooked","4 oz",245,29,0,13],

["Tuna, canned in water","1 can (5 oz)",120,26,0,1],["Shrimp, cooked","4 oz",112,24,1,1],["Eggs, whole","2 large",143,13,1,10],
["Egg whites","1 cup",126,26,2,0],["Greek yogurt, nonfat plain","1 cup",130,23,9,0.5],["Cottage cheese, 2%","1 cup",183,24,10,5],
["Whey protein","1 scoop (30 g)",120,24,3,1.5],["Milk, 2%","1 cup",122,8,12,5],["Cheddar cheese","1 oz",114,7,0.5,9],

["Olive oil","1 tbsp",119,0,0,13.5],["Butter","1 tbsp",102,0,0,11.5],["Peanut butter","2 tbsp",190,7,7,16],
["Almonds","1 oz",164,6,6,14],["Protein bar","1 bar",200,20,22,7],["Granola","1/2 cup",240,6,32,10],
["Cereal with milk","1 bowl",220,8,40,4],["Pizza, cheese","1 slice",285,12,36,10],["Burger with cheese, quarter pound","1 burger",520,30,42,26],
["French fries","1 medium",365,4,48,17],["Burrito bowl, chicken","1 bowl",650,45,65,22],["Sushi roll, salmon","8 pieces",300,13,45,7],
["Grilled chicken sandwich","1 sandwich",380,30,40,10],["Coffee, black","1 cup",2,0,0,0],["Latte, 2% milk","12 oz",150,10,15,6],
["Orange juice","1 cup",112,2,26,0.5],["Soda, regular","12 oz can",140,0,39,0],["Beer","12 oz",153,2,13,0],
["Wine","5 oz",125,0,4,0],["Ice cream","1/2 cup",140,2,16,7],["Dark chocolate","1 oz",170,2,13,12],
["Beef jerky","1 oz",80,11,5,1.5],["Hummus","2 tbsp",70,2,4,5],["Honey","1 tbsp",64,0,17,0]
].map(f => ({name:f[0],serv:f[1],kcal:f[2],p:f[3],c:f[4],f:f[5]}));

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseD = s => { const a = s.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const utc = s => { const a = s.split("-").map(Number); return Date.UTC(a[0], a[1] - 1, a[2]); };
const diff = (a, b) => Math.round((utc(a) - utc(b)) / 864e5);
const fmt = n => Math.round(n).toLocaleString("en-US");
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const r1 = n => Math.round(n * 10) / 10;
const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
const stdev = a => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); };
const uid6 = () => Math.random().toString(36).slice(2, 10);
const longDate = s => parseD(s).toLocaleDateString("en-US", {weekday:"long", month:"short", day:"numeric"});
const shortDate = s => parseD(s).toLocaleDateString("en-US", {month:"short", day:"numeric"});
const fin = v => (typeof v === "number" && isFinite(v));

/* ---------- state ---------- */
const S = {profile:null, days:{}, demo:false};
const UI = {tab:"today", date:today(), range:30, loading:true, pick:null, manual:false, qty:1, draft:null, formUnits:"us",
            sample:null, tools:false, chat:[], pending:"", note:"", asking:false, ctl:null, arm:null, io:false, msg:"",
            look:null, looking:false, lookErr:"", sug:[]};
const metric = () => S.profile && S.profile.units === "metric";
const wOut = lb => metric() ? lb * LB_KG : lb;
const wIn = v => metric() ? v / LB_KG : v;
const wu = () => metric() ? "kg" : "lb";

/* ---------- storage: Claude account when available, this browser otherwise ---------- */
const Store = {
  col:null, queue:{}, status:"local",
  readLocal(){ try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; } },
  writeLocal(){ if (S.demo) return; try { localStorage.setItem(LS_KEY, JSON.stringify({profile:S.profile, days:S.days})); } catch (e) {} },
  clearLocal(){ try { localStorage.removeItem(LS_KEY); } catch (e) {} },
  put(id, data){
    this.writeLocal();
    if (S.demo || !this.col) return;
    const q = this.queue[id] || (this.queue[id] = {busy:false, next:null});
    q.next = {data: data ? JSON.parse(JSON.stringify(data)) : null};
    if (!q.busy) this.flush(id);
  },
  async flush(id){
    const q = this.queue[id]; q.busy = true;
    while (q.next) {
      const job = q.next; q.next = null;
      try {
        const ref = this.col.doc(id);
        if (job.data) await ref.set(job.data); else await ref.delete();
        setSync("db");
      } catch (e) { setSync("err"); }
    }
    q.busy = false;
  }
};
function setSync(s){
  Store.status = s;
  const el = $("#sync"); if (!el) return;
  const st = S.demo ? "demo" : s;
  el.dataset.s = st;
  el.textContent = {demo:"Example data", db:"Synced to your Claude account", err:"Sync failed. Saved on this device", local:"Saved on this device"}[st];

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), ms))]);

/* ---------- day records ---------- */
function getDay(d){ return S.days[d] || (S.days[d] = {date:d, weight:null, trained:false, entries:[]}); }
function saveDay(d){

}
function totals(day){

  if (day) for (const e of day.entries) { t.k += e.kcal; t.p += e.p; t.c += e.c; t.f += e.f; t.n++; }

}
function mkEntry(food, qty, meal){
  return {id:uid6(), name:food.name, serv:food.serv, qty:qty, meal:meal,
          kcal:Math.round(food.kcal * qty), p:r1(food.p * qty), c:r1(food.c * qty), f:r1(food.f * qty)};

/* ---------- model ---------- */
function trendSeries(){
  const ds = Object.keys(S.days).filter(d => S.days[d].weight > 0).sort();
  let t = null, prev = null;
  return ds.map(d => {
    const w = S.days[d].weight;
    if (t === null) t = w; else t += (1 - Math.pow(0.8, Math.max(1, diff(d, prev)))) * (w - t);

function ols(pts){

function compute(){

  const span = pts.length ? pts[pts.length - 1].x - pts[0].x : 0;

  for (let i = 28; i >= 1; i--) {

  const tdee = override || auto;
  const gap = p.goalWeight - cur, dir = gap < -1 ? -1 : gap > 1 ? 1 : 0;
  const rate = dir * (p.pacePct / 100) * cur * (dir > 0 ? 0.5 : 1); // lb per week, signed; gain runs at half pace
  const floor = p.sex === "m" ? 1500 : 1200;

  const floorHit = kcal < floor; if (floorHit) kcal = floor;
  kcal = Math.round(kcal / 10) * 10;

function advise(C){

  if (C.dir === 0) add("good", "You are at your goal weight", "Trend weight is within 1 lb of your goal, so the target is set to maintenance. Set a new goal in Plan if you want to keep moving.");
  if (C.override) add("info", "Maintenance is set manually to " + fmt(C.override) + " kcal", "The automatic estimate is currently " + fmt(C.auto) + " kcal. The manual figure stays until you clear it in Plan, so it will not adapt as your data changes.");

      (nl || nw ? "Log " + (nl ? nl + " more full day" + (nl > 1 ? "s" : "") + " of food" : "") + (nl && nw ? " and " : "") + (nw ? nw + " more weigh-in" + (nw > 1 ? "s" : "") : "") + ", spread over at least 10 days," : "Keep weighing in until your weigh-ins span 10 days,") +

  } else {

      "Formula: " + fmt(C.formula) + " kcal. Your last " + C.est.n + " days: " + fmt(C.est.value) + " ± " + fmt(C.est.se) + " kcal. The target uses a blend weighted " + Math.round(C.est.w * 100) + "% toward your data, and that weight grows as you log more days.");
    if (C.est.outOfRange) add("warn", "Logged intake and weight change do not reconcile", "Taken at face value they imply maintenance of " + fmt(C.est.raw) + " kcal, which is outside a plausible range. The usual causes are unlogged food, a short run of water-weight swings, or too few weigh-ins. The estimate is capped until the data settles.");

    else if (d > 0.05) add("warn", "Averaging " + fmt(C.avg7 - T.kcal) + " kcal over target", "Your last " + C.n7 + " logged days averaged " + fmt(C.avg7) + " kcal against " + fmt(T.kcal) + ". At that intake the expected pace is " + impliedTxt + (C.dir !== 0 ? ", against a plan of " + (C.rate > 0 ? "+" : "−") + f1(Math.abs(wOut(C.rate))) + "." : "."));
    else if (d < -0.15) add("warn", "Eating " + fmt(T.kcal - C.avg7) + " kcal under target", "Your last " + C.n7 + " logged days averaged " + fmt(C.avg7) + " kcal. A deficit this far past plan costs lean mass and training quality. Bring intake back up toward " + fmt(T.kcal) + ". If days are only partly logged, that explains the gap instead.");
    else add("info", "Slightly under target", "Averaging " + fmt(C.avg7) + " kcal against " + fmt(T.kcal) + ". Fine for a few days; do not let it widen.");

      else if (obs > C.rate * 0.5) add("info", "Loss is slower than planned", "Trend: " + obsTxt + " against a plan of " + planTxt + ". " + (C.est ? "The maintenance estimate already reflects this, so the target has adjusted. Hold it for two weeks before changing anything else." : "Keep logging. Once there is enough data the target will correct itself."));
      else add("good", "Weight is moving at the planned pace", "Trend: " + obsTxt + " against a plan of " + planTxt + ".");
    } else {
      if (obs > C.rate * 2) add("warn", "Gaining faster than planned", "Trend: " + obsTxt + " against a plan of " + planTxt + ". Gain beyond the plan is mostly fat. Trim intake toward target.");

  }

function loadDemo(){
  S.demo = true; S.days = {};
  S.profile = {v:1, sex:"m", age:34, heightIn:71, activity:1.55, units:"us", goalWeight:195, pacePct:0.5, proteinPerLb:1, sessions:3, startWeight:212, foods:[]};
  let seed = 11; const rnd = () => { seed = seed * 16807 % 2147483647; return seed / 2147483647; };
  const F = n => FOODS.find(f => f.name === n);
  const B = [[["Oats, dry",1.5],["Whey protein",1],["Banana",1]], [["Eggs, whole",2],["Bread, whole wheat",1],["Greek yogurt, nonfat plain",1]]];
  const L = [[["Chicken breast, cooked",1.5],["White rice, cooked",1.5],["Broccoli, cooked",1],["Olive oil",1]], [["Burrito bowl, chicken",1]], [["Tuna, canned in water",1],["Bread, whole wheat",1],["Apple",1],["Almonds",1]]];
  const D = [[["Salmon, cooked",1],["Potato, baked",1.5],["Mixed salad greens",1],["Olive oil",1]], [["Ground beef 90/10, cooked",1.5],["Pasta, cooked",2]], [["Steak, sirloin, cooked",1],["Sweet potato, baked",2],["Broccoli, cooked",1]]];
  const N = [[["Protein bar",1]], [["Greek yogurt, nonfat plain",1],["Blueberries",1]], [["Peanut butter",1],["Apple",1]]];
  const T = today(); let w = 212;
  for (let i = 24; i >= 0; i--) {
    const d = addDays(T, -i), dow = parseD(d).getDay(), day = {date:d, weight:null, trained:false, entries:[]};
    const put = (set, meal) => set.forEach(x => day.entries.push(mkEntry(F(x[0]), x[1], meal)));
    put(B[Math.floor(rnd() * B.length)], "Breakfast"); put(L[Math.floor(rnd() * L.length)], "Lunch");
    if (i > 0) {
      put(D[Math.floor(rnd() * D.length)], "Dinner"); put(N[Math.floor(rnd() * N.length)], "Snacks");
      if (dow === 6 || dow === 0) put([["Pizza, cheese",2],["Beer",2]], "Dinner");
      day.trained = (dow === 1 || dow === 3 || dow === 5) && i !== 8;
    }
    const k = i > 0 ? totals(day).k : 2400;
    if (i === 16 || i === 9) day.entries = [];
    if (i % 6 !== 4) day.weight = r1(w + (rnd() - 0.5) * 1.8);
    w += (k - 2900) / KCAL_PER_LB;
    S.days[d] = day;
  }
}

function niceTicks(lo, hi, n){
  const step0 = (hi - lo || 1) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function xLabels(from, range, x, H, m){
  let s = ""; const step = range <= 30 ? 7 : 21, T = today();
  for (let i = 0; i < range; i += step) { const d = addDays(T, -i), px = x(d); if (px < m.l + 14) break; s += '<text x="' + px.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? "end" : "middle") + '">' + shortDate(d) + '</text>'; }
  return s;
}
function drawCharts(C){

  else {

    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const g = wOut(S.profile.goalWeight), slack = wOut(10), showGoal = g >= lo - slack && g <= hi + slack;
    if (showGoal) { lo = Math.min(lo, g); hi = Math.max(hi, g); }

  if (name === name.toUpperCase()) name = name.charAt(0) + name.slice(1).toLowerCase();
  const brand = f.brandName || f.brandOwner; if (brand) name += " (" + String(brand).trim() + ")";
  return {name:name.slice(0, 80), serv:serv.slice(0, 40), kcal:Math.round(kcal * k), p:r1(p * k), c:r1(c * k), f:r1(fat * k)};
}
async function lookup(){
  const q = $("#food-q"), term = q ? q.value.trim() : "";
  if (!term || UI.looking) return;
  UI.looking = true; UI.lookErr = ""; renderSug();
  try {
    const r = await fetch("https://api.nal.usda.gov/fdc/v1/foods/search?api_key=" + encodeURIComponent(UI.fdcKey || "DEMO_KEY") + "&pageSize=8&dataType=" + encodeURIComponent("Foundation,SR Legacy,Branded") + "&query=" + encodeURIComponent(term.slice(0, 120)));
    if (r.status === 429) throw {code:"rate"};
    if (!r.ok) throw {code:"http"};
    const j = await r.json();
    UI.look = {term:term.toLowerCase(), list:(j.foods || []).map(fdcFood).filter(Boolean).slice(0, 8)};
  } catch (e) {
    UI.lookErr = e && e.code === "rate" ? "The shared USDA demo key is rate limited (about 30 lookups an hour). Add your own free key in Plan, or enter this one manually." : "The USDA database could not be reached. Try again, or enter it manually.";
  } finally { UI.looking = false; renderSug(); }
}
function renderSug(){
  const box = $("#sug"), q = $("#food-q"); if (!box || !q) return;
  const pool = foodPool(), raw = q.value.trim(), term = raw.toLowerCase();
  const local = term ? pool.all.filter(f => term.split(/\s+/).every(w => f.name.toLowerCase().includes(w))).slice(0, 8) : pool.recents.slice(0, 6);
  const db = (term && UI.look && UI.look.term === term) ? UI.look.list : null;
  UI.sug = local.concat(db || []);
  const btn = (f, i) => '<button type="button" class="s-item" data-act="pick" data-i="' + i + '"><span class="s-name">' + esc(f.name) + ' <span class="s-serv">' + esc(f.serv) + '</span></span><span class="s-k">' + f.kcal + ' kcal</span></button>';
  let h = "";
  if (local.length) h += (term ? "" : '<div class="meal-h"><span>Recent</span></div>') + local.map((f, i) => btn(f, i)).join("");
  else if (!term) h += '<p class="empty">Start typing to search your foods and ' + FOODS.length + ' common ones, then search the USDA database for anything else. Foods you log show up here for one-tap re-entry.</p>';
  else if (!db && !UI.looking) h += '<p class="empty">No match in your foods or the built-in list.</p>';
  if (db) h += '<div class="meal-h"><span>USDA FoodData Central</span></div>' + (db.length ? db.map((f, i) => btn(f, local.length + i)).join("") : '<p class="empty">Nothing found. Enter it manually.</p>');
  if (term.length >= 2 && !db) h += UI.looking ? '<p class="empty">Searching the USDA database…</p>' : '<div class="row" style="padding-top:10px"><button type="button" class="btn small" data-act="lookup">Search the USDA database for “' + esc(raw) + '”</button></div>';
  if (UI.lookErr) h += '<p class="err">' + esc(UI.lookErr) + '</p>';
  box.innerHTML = h;
}

/* ---------- calibration chat: Claude API with the user's own key ---------- */
function coachView(C){
  let h = '<section class="sec"><div class="sec-head"><h2>What your numbers say</h2><span class="muted">Recalculated every time you log</span></div><div>';
  for (const a of C.adv) h += '<div class="adv"><span class="pill ' + a.sev + '">' + pillText(a.sev) + '</span><h3>' + esc(a.title) + '</h3><p>' + esc(a.body) + '</p></div>';
  h += '</div></section><section class="ask"><div><h2>Calibrate with Claude</h2><p class="muted">A chat that sees your profile, targets and last 15 days of logs. It can change your plan, set your maintenance figure, and log food or weight when you ask. The conversation is not saved after you close the page.</p></div>';
  if (!UI.user || S.demo) h += '<p class="muted">Sign in and set up your profile first, so the chat has your own numbers to work with.</p>';
  else if (!UI.apiKey) h += '<p class="muted">The chat runs on your own Anthropic API key. Add one under Plan, in Connections. Messages go straight from this browser to Anthropic and are billed to that key.</p><div class="row"><a class="btn" href="#plan">Add a key</a></div>';
  else {
    if (UI.chat.length || UI.asking) h += '<div class="chat" id="chat">' + UI.chat.map(m => '<div class="msg ' + m.role + '">' + esc(m.content) + '</div>').join("") + (UI.asking ? '<div class="msg assistant" id="chat-live">' + esc(UI.pending || "Thinking…") + '</div>' : "") + '</div>';
    else h += '<div class="chips">' + ["Give me a read of my last two weeks", "Is my activity level set right?", "My weight is not moving. Recalibrate my maintenance", "Log two eggs, toast and a latte for breakfast"].map(t => '<button class="btn small" data-act="chip">' + t + '</button>').join("") + '</div>';
    h += '<form id="chat-form" class="row"><input type="text" id="chat-q" maxlength="500" autocomplete="off" aria-label="Message" placeholder="Ask a question, or tell it what you ate"><button class="btn primary" type="submit"' + (UI.asking ? " disabled" : "") + '>Send</button>' + (UI.asking ? '<button class="btn" type="button" data-act="stopAsk">Stop</button>' : "") + '</form>' + (UI.note ? '<p class="err">' + esc(UI.note) + '</p>' : "");
  }
  return h + '</section>';
}
async function send(text){
  if (UI.asking || !UI.apiKey || !UI.user || S.demo || !text) return;
  UI.chat.push({role:"user", content:text.slice(0, 500)});
  UI.asking = true; UI.pending = ""; UI.note = ""; UI.ctl = new AbortController(); render();
  const system = CHAT_RULES.replace("UNIT", metric() ? "kilograms" : "pounds") + "\n\nDATA (live, as of this message):\n" + JSON.stringify(coachData(compute()));
  let msgs = UI.chat.filter(m => m.role !== "note").slice(-12).map(m => ({role:m.role, content:m.content}));
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  const tools = chatTools(), apiTools = tools.map(t => ({name:t.name, description:t.description, input_schema:t.inputSchema}));
  let out = "";
  const show = () => { UI.pending = out; const o = $("#chat-live"); if (o) { o.textContent = out || "Thinking…"; const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; } };
  try {
    for (let round = 0; round < 6; round++) {
      const r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", signal:UI.ctl.signal,
        headers:{"content-type":"application/json", "x-api-key":UI.apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:CLAUDE_MODEL, max_tokens:1024, system:system, messages:msgs, tools:apiTools})});
      if (!r.ok) throw {status:r.status};
      const j = await r.json(), blocks = j.content || [];
      const txt = blocks.filter(b => b.type === "text").map(b => b.text).join("");
      if (txt) { out += (out ? "\n\n" : "") + txt; show(); }
      if (j.stop_reason !== "tool_use") break;
      msgs.push({role:"assistant", content:blocks});
      const results = [];
      for (const b of blocks) if (b.type === "tool_use") {
        const t = tools.find(x => x.name === b.name); let res, bad = false;
        try { if (!t) throw new Error("Unknown tool"); res = t.execute(b.input || {}); } catch (e) { res = "Error: " + (e && e.message || "failed"); bad = true; }
        results.push({type:"tool_result", tool_use_id:b.id, content:typeof res === "string" ? res : JSON.stringify(res), is_error:bad});
      }
      msgs.push({role:"user", content:results});
    }
    if (out) UI.chat.push({role:"assistant", content:out});
  } catch (e) {
    if (out) UI.chat.push({role:"assistant", content:out});
    const st = e && e.status;
    if (e && e.name === "AbortError") { /* stopped by the user */ }
    else if (st === 401 || st === 403) UI.note = "Anthropic rejected that API key. Check it under Plan, in Connections.";
    else if (st === 429) UI.note = "Your API key is rate limited or out of credit. Try again later.";
    else if (st === 404 || st === 400) UI.note = "Anthropic rejected the request (error " + st + "). The model name in this build may need updating.";
    else UI.note = "Claude could not be reached. Try again in a moment.";
  } finally { UI.asking = false; UI.pending = ""; UI.ctl = null; render(); const q = $("#chat-q"); if (q) q.focus(); }
}

/* ---------- auth and boot ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "signin" && window.firebase && !UI.noBackend) {
    UI.authErr = "";
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      const code = e && e.code;
      if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
      UI.authErr = code === "auth/operation-not-allowed" ? "Google sign-in is not switched on for this Firebase project yet." : code === "auth/popup-blocked" ? "Your browser blocked the sign-in window. Allow pop-ups for this site and try again." : "Sign-in did not complete. Try again.";
      render();
    });
  }
  else if (act === "signout" && window.firebase) firebase.auth().signOut();
  else if (act === "saveKeys") {
    UI.apiKey = ($("#k-claude").value || "").trim(); UI.fdcKey = ($("#k-fdc").value || "").trim();
    lsSet("fl-anthropic-key", UI.apiKey); lsSet("fl-fdc-key", UI.fdcKey); b.textContent = "Saved";
  }
});
let authGen = 0;
async function onUser(user){
  const my = ++authGen;
  UI.user = user || null; Store.col = null; Store.queue = {}; Store.status = "local";
  S.profile = null; S.days = {}; S.demo = false; UI.chat = []; UI.draft = null;
  if (!user) { loadDemo(); UI.loading = false; render(); return; }
  const cached = Store.readLocal(), hasCache = !!(cached && cached.profile);
  if (hasCache) { S.profile = cached.profile; S.days = cached.days || {}; UI.loading = false; } else UI.loading = true;
  render();
  try {
    const col = firebase.firestore().collection("users").doc(user.uid).collection("docs");
    const snap = await withTimeout(col.get(), 15000);
    if (my !== authGen) return;
    let rp = null; const rd = {};
    snap.docs.forEach(doc => { const v = doc.data(); if (!v) return; if (doc.id === "profile") rp = JSON.parse(JSON.stringify(v)); else if (doc.id.indexOf("d-") === 0) { const c = JSON.parse(JSON.stringify(v)); if (!Array.isArray(c.entries)) c.entries = []; rd[doc.id.slice(2)] = c; } });
    Store.col = col; Store.status = "db";
    if (rp) { S.profile = rp; S.days = rd; S.demo = false; Store.writeLocal(); }
    else if (hasCache) { Store.put("profile", S.profile); Object.keys(S.days).forEach(d => Store.put("d-" + d, S.days[d])); }
  } catch (e) { if (my !== authGen) return; }
  if (!S.profile) loadDemo();
  UI.loading = false; render();
}
function boot(){
  const h = location.hash.slice(1); if (["today","trends","coach","plan"].includes(h)) UI.tab = h;
  UI.apiKey = lsGet("fl-anthropic-key"); UI.fdcKey = lsGet("fl-fdc-key");
  if (!(window.firebase && firebase.apps && firebase.apps.length)) { UI.noBackend = true; loadDemo(); UI.loading = false; render(); return; }
  firebase.auth().onAuthStateChanged(onUser, () => onUser(null));
}
boot();
